<div class="pdf-viewer-container" style="margin: 50px 90px">
  <div class="control-section" style="margin-bottom: 8px">
    <button id="enableCalloutMode">Enable Callout Mode</button>
    <button id="exitCalloutMode">Exit Callout Mode</button>
    <button id="addCalloutProgrammatically">Add Callout Programmatically</button>
    <button id="editCalloutProgrammatically">Edit Callout Programmatically</button>
  </div>
  <ejs-pdfviewer
    id="container"
    [documentPath]="documentPath"
    [resourceUrl]="resourceUrl"
    style="height: 640px; display: block">
  </ejs-pdfviewer>
</div>
