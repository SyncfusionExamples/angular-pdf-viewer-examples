<div class="pdf-viewer-container" style="margin: 50px 90px">
  <div class="control-section" style="margin-bottom: 8px">
    <button id="addDateField">Add Date Picker</button>
    <button id="addTimeField">Add Time Picker</button>
    <button id="setDateTimeMode">Set DateTime Picker Mode</button>
    <button id="setTimeMode">Set Time Picker Mode</button>
  </div>
  <ejs-pdfviewer
    id="container"
    [documentPath]="documentPath"
    [resourceUrl]="resourceUrl"
    style="height: 680px; display: block">
  </ejs-pdfviewer>
</div>
